<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Brian Pérez López — Software Engineer · .NET &amp; Full-Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0A1F"/>
      <stop offset="0.55" stop-color="#15103A"/>
      <stop offset="1" stop-color="#0A1F33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glowPurple" gradientUnits="userSpaceOnUse" cx="160" cy="40" r="420">
      <stop offset="0" stop-color="#512BD4" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#512BD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" gradientUnits="userSpaceOnUse" cx="1080" cy="320" r="440">
      <stop offset="0" stop-color="#0E75B6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0E75B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
    <style>
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .rise { animation: rise 0.9s ease-out both; }
      .rise2 { animation: rise 0.9s ease-out 0.15s both; }
      .rise3 { animation: rise 0.9s ease-out 0.3s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glowPurple)"/>
    <rect width="1200" height="320" fill="url(#glowBlue)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Izquierda: prompt, nombre y rol -->
  <g class="rise">
    <text x="72" y="98" class="mono" font-size="18" fill="#8B93B8">
      <tspan fill="#A78BFA">~/brian</tspan> <tspan fill="#8B93B8">$</tspan> <tspan fill="#E2E8F0">dotnet run</tspan> <tspan class="cursor" fill="#A78BFA">▋</tspan>
    </text>
  </g>

  <text x="68" y="178" class="sans rise2" font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Brian Pérez López</text>

  <text x="72" y="226" class="sans rise3" font-size="26" font-weight="500">
    <tspan fill="#CBD5E1">Software Engineer</tspan>
    <tspan fill="#64748B"> · </tspan>
    <tspan fill="url(#accent)" font-weight="700">.NET &amp; Full-Stack</tspan>
  </text>

  <!-- Derecha: tarjeta de código -->
  <g transform="translate(790 72)"><g class="rise3">
    <rect width="340" height="176" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle cx="24" cy="24" r="6" fill="#FF5F57"/>
    <circle cx="44" cy="24" r="6" fill="#FEBC2E"/>
    <circle cx="64" cy="24" r="6" fill="#28C840"/>
    <text x="316" y="29" class="mono" font-size="12" fill="#64748B" text-anchor="end">Program.cs</text>
    <g class="mono" font-size="16">
      <text x="24" y="72"><tspan fill="#C792EA">var</tspan><tspan fill="#E2E8F0"> dev = </tspan><tspan fill="#C792EA">new</tspan><tspan fill="#7DD3FC"> Developer</tspan><tspan fill="#E2E8F0">();</tspan></text>
      <text x="24" y="102"><tspan fill="#E2E8F0">dev.</tspan><tspan fill="#82AAFF">Design</tspan><tspan fill="#E2E8F0">(</tspan><tspan fill="#C3E88D">"Clean"</tspan><tspan fill="#E2E8F0">);</tspan></text>
      <text x="24" y="132"><tspan fill="#E2E8F0">dev.</tspan><tspan fill="#82AAFF">Test</tspan><tspan fill="#E2E8F0">().</tspan><tspan fill="#82AAFF">Ship</tspan><tspan fill="#E2E8F0">();</tspan></text>
      <text x="24" y="158" fill="#546E7A">// ✔ Build succeeded</text>
    </g>
  </g></g>
</svg>
